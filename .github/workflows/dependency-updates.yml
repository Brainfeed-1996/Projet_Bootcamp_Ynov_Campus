name: Automated Dependency Updates

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC
  workflow_dispatch:
    inputs:
      update-type:
        description: 'Type of updates to apply'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - security-only
          - minor-patch-only

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-python-deps:
    name: Update Python dependencies
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.update-type != 'security-only' || github.event_name == 'schedule' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pip-tools
        run: |
          pip install pip-tools

      - name: Update dependencies (minor/patch)
        if: ${{ github.event.inputs.update-type != 'security-only' }}
        run: |
          pip-compile --upgrade --output-file=requirements.txt pyproject.toml

      - name: Update security dependencies
        if: ${{ github.event.inputs.update-type == 'security-only' || github.event_name == 'schedule' }}
        run: |
          pip install safety
          safety check -r requirements.txt --json > safety-report.json || true
          python -c "
import json, subprocess, sys
with open('safety-report.json') as f:
    data = json.load(f)
for vuln in data.get('vulnerabilities', []):
    pkg = vuln['package_name']
    subprocess.run(['pip', 'install', '--upgrade', pkg], check=False)
"

      - name: Run tests after updates
        run: |
          pip install -r requirements.txt
          pip install pytest-cov
          pytest -v --disable-warnings --cov=app --cov-report=xml

      - name: Run security scans
        run: |
          pip install bandit safety
          bandit -r app.py -f json -o bandit-report.json || true
          safety check -r requirements.txt --json > safety-report.json || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@271a8d0340229f3726113333e5c67c5d7c7e4c6e # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "deps: update Python dependencies"
          title: "deps: automated Python dependency updates"
          body: |
            This PR contains automated dependency updates.
            
            **Changes:**
            - Updated Python packages to latest compatible versions
            - Ran test suite to verify compatibility
            - Ran security scans (Bandit, Safety)
            
            **Testing:**
            - All tests pass
            - Security scans completed
          branch: automated/deps-update-${{ github.run_id }}
          labels: |
            dependencies
            automated
          reviewers: security-team
          assignees: devops-lead

  update-github-actions:
    name: Update GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Actions
        uses: docker://ghcr.io/dependabot/dependabot-core:latest
        with:
          args: update --package-manager github_actions --directory .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@271a8d0340229f3726113333e5c67c5d7c7e4c6e # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci: update GitHub Actions"
          title: "ci: automated GitHub Actions updates"
          body: |
            This PR contains automated GitHub Actions updates.
          branch: automated/gh-actions-update-${{ github.run_id }}
          labels: |
            github-actions
            automated

  update-docker-base:
    name: Update Docker base images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for base image updates
        run: |
          # Check Python base image
          current_python=$(grep '^FROM python:' Dockerfile | head -1 | sed 's/FROM python://')
          latest_python=$(curl -s https://hub.docker.com/v2/repositories/library/python/tags/?page_size=100 | jq -r '.results[] | select(.name | test("^3\\.11")) | .name' | sort -V | tail -1)
          echo "Current Python: $current_python"
          echo "Latest Python: $latest_python"
          
          # Check Postgres base image
          current_pg=$(grep '^FROM postgres:' docker-compose.production.yml | head -1 | sed 's/.*postgres://')
          latest_pg=$(curl -s https://hub.docker.com/v2/repositories/library/postgres/tags/?page_size=100 | jq -r '.results[] | select(.name | test("^15")) | .name' | sort -V | tail -1)
          echo "Current Postgres: $current_pg"
          echo "Latest Postgres: $latest_pg"
          
          # Check Vault base image
          current_vault=$(grep 'hashicorp/vault:' docker-compose.vault.yml | head -1 | sed 's/.*vault://')
          latest_vault=$(curl -s https://hub.docker.com/v2/repositories/hashicorp/vault/tags/?page_size=100 | jq -r '.results[] | select(.name | test("^1\\.15")) | .name' | sort -V | tail -1)
          echo "Current Vault: $current_vault"
          echo "Latest Vault: $latest_vault"

      - name: Create Pull Request for Docker updates
        if: false  # Enable when updates are needed
        uses: peter-evans/create-pull-request@271a8d0340229f3726113333e5c67c5d7c7e4c6e # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docker: update base images"
          title: "docker: automated base image updates"
          body: |
            This PR contains automated Docker base image updates.
          branch: automated/docker-update-${{ github.run_id }}
          labels: |
            docker
            automated