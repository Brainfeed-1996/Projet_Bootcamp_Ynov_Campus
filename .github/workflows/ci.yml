name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: log-sentinel-api
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff mypy pytest-cov

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy --ignore-missing-imports app.py

      - name: Run tests
        run: pytest -q --cov=app --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run Bandit
        run: bandit -r . -f sarif -o bandit.sarif --severity high --exit-zero

      - name: Upload Bandit results
        if: ${{ always() && hashFiles('bandit.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          sarif_file: bandit.sarif

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
          generateSarif: true

      - name: Upload Semgrep results
        if: ${{ always() && hashFiles('semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          sarif_file: semgrep.sarif

  snyk:
    name: Snyk security
    runs-on: ubuntu-latest
    if: ${{ secrets.SNYK_TOKEN != '' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Scan dependencies
        continue-on-error: true
        uses: snyk/actions/python@9adf32b1121593767fc3c057af55b55db032dc04
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-dependencies.sarif

      - name: Scan source code
        continue-on-error: true
        uses: snyk/actions@9adf32b1121593767fc3c057af55b55db032dc04
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high --sarif-file-output=snyk-code.sarif

      - name: Upload dependency results
        if: ${{ always() && hashFiles('snyk-dependencies.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          sarif_file: snyk-dependencies.sarif

      - name: Upload source results
        if: ${{ always() && hashFiles('snyk-code.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          sarif_file: snyk-code.sarif

  container-security:
    name: Build and scan container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1
        with:
          context: .
          target: production
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan filesystem
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-filesystem.sarif
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload filesystem results
        if: ${{ always() && hashFiles('trivy-filesystem.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          sarif_file: trivy-filesystem.sarif

      - name: Upload image results
        if: ${{ always() && hashFiles('trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          sarif_file: trivy-image.sarif

  compose-validation:
    name: Validate Compose
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare validation secrets
        run: |
          umask 077
          mkdir -p secrets
          printf '%s' 'ci-db-password' > secrets/db_password.txt
          printf '%s' 'ci-secret-key' > secrets/secret_key.txt
          printf '%s' 'ci-db-user' > secrets/postgres_user.txt
          printf '%s' 'ci-db-password' > secrets/postgres_password.txt
          printf '%s' 'ci-openai-key' > secrets/openai_api_key.txt
          cp .env.production.example .env.production

      - name: Validate base Compose file
        run: docker compose -f compose.yaml config --quiet

      - name: Validate production overlay
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Validate Vault overlay
        run: docker compose -f docker-compose.vault.yml config --quiet

      - name: Validate production stack
        run: docker compose -f compose.yaml -f docker-compose.production.yml config --quiet

      - name: Validate Vault stack
        run: docker compose -f compose.yaml -f docker-compose.vault.yml config --quiet

      - name: Validate combined overlays
        run: docker compose -f compose.yaml -f docker-compose.production.yml -f docker-compose.vault.yml config --quiet

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [container-security, compose-validation]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare runtime secrets
        run: |
          umask 077
          mkdir -p secrets
          printf '%s' 'integration-db-password' > secrets/db_password.txt
          printf '%s' 'integration-secret-key' > secrets/secret_key.txt
          printf '%s' 'integration-db-user' > secrets/postgres_user.txt
          printf '%s' 'integration-db-password' > secrets/postgres_password.txt
          printf '%s' 'integration-openai-key' > secrets/openai_api_key.txt
          cp .env.production.example .env.production

      - name: Start production stack
        run: docker compose -f compose.yaml -f docker-compose.production.yml up -d --wait

      - name: Check API health
        run: curl --fail --silent --show-error http://localhost:5000/health

      - name: Run integration tests
        run: docker compose exec --no-TTY web pytest -q tests/test_integration.py

      - name: Stop production stack
        if: always()
        run: docker compose -f compose.yaml -f docker-compose.production.yml down --volumes --remove-orphans
