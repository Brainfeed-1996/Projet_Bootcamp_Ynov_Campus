name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_NAME: music-hall
  COMPOSE_FILES: compose.yaml docker-compose.production.yml docker-compose.vault.yml

jobs:
  test:
    name: Tests (offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (offline)
        run: |
          pytest -v --disable-warnings

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: ${{ env.IMAGE_NAME }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: ${{ env.IMAGE_NAME }}:latest
          load: true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  compose-validate:
    name: Validate Compose files
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare production env file
        run: |
          cp .env.production.example .env.production

      - name: Validate compose.yaml
        run: |
          docker compose -f compose.yaml config --quiet

      - name: Validate docker-compose.production.yml
        run: |
          docker compose -f docker-compose.production.yml config --quiet

      - name: Validate docker-compose.vault.yml
        run: |
          docker compose -f docker-compose.vault.yml config --quiet

  snyk-deps:
    name: Snyk dependency scan
    runs-on: ubuntu-latest
    needs: test
    if: ${{ secrets.SNYK_TOKEN != '' }}
    continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Snyk test (dependencies)
        uses: snyk/actions@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high

  snyk-code:
    name: Snyk code scan
    runs-on: ubuntu-latest
    needs: test
    if: ${{ secrets.SNYK_TOKEN != '' }}
    continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Snyk code test
        uses: snyk/actions@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test