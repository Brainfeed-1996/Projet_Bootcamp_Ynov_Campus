name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_NAME: log-sentinel-api
  COMPOSE_FILES: compose.yaml docker-compose.production.yml docker-compose.vault.yml
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff, mypy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run ruff
        run: |
          ruff check .

      - name: Run mypy
        run: |
          mypy app.py

  test:
    name: Tests (offline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests (offline)
        run: |
          pytest -v --disable-warnings --cov=app --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: coverage
          path: coverage.xml

  bandit:
    name: Bandit security scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install bandit
        run: |
          pip install bandit[toml]

      - name: Run Bandit
        run: |
          bandit -r . -f sarif -o bandit-results.sarif --skip B101,B601 || true

      - name: Upload Bandit results to GitHub Security
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: bandit-results.sarif

  semgrep:
    name: Semgrep SAST scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@0e5b9c4a7a4b6c4e4f4e4e4e4e4e4e4e4e4e4e4e4 # v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
          generateSarif: true

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: semgrep.sarif

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, bandit, semgrep]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          tags: ${{ env.IMAGE_NAME }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

  trivy:
    name: Trivy scan (image + fs)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          tags: ${{ env.IMAGE_NAME }}:latest
          load: true

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Run Trivy vulnerability scanner (image)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-image-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy FS results
        if: always()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: trivy-fs-results.sarif

      - name: Upload Trivy image results
        if: always()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: trivy-image-results.sarif

  snyk-deps:
    name: Snyk dependency scan
    runs-on: ubuntu-latest
    needs: test
    if: ${{ secrets.SNYK_TOKEN != '' }}
    continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Snyk test (dependencies)
        uses: snyk/actions@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high

  snyk-code:
    name: Snyk code scan
    runs-on: ubuntu-latest
    needs: test
    if: ${{ secrets.SNYK_TOKEN != '' }}
    continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Snyk code test
        uses: snyk/actions@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test

  compose-validate:
    name: Validate Compose files
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare production env file
        run: |
          cp .env.production.example .env.production

      - name: Validate compose.yaml
        run: |
          docker compose -f compose.yaml config --quiet

      - name: Validate docker-compose.production.yml
        run: |
          docker compose -f docker-compose.production.yml config --quiet

      - name: Validate docker-compose.vault.yml
        run: |
          docker compose -f docker-compose.vault.yml config --quiet

      - name: Validate combined overlays (compose.yaml + production)
        run: |
          docker compose -f compose.yaml -f docker-compose.production.yml config --quiet

      - name: Validate combined overlays (compose.yaml + vault)
        run: |
          docker compose -f compose.yaml -f docker-compose.vault.yml config --quiet

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [build, trivy]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare production env file
        run: |
          cp .env.production.example .env.production

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@0c3e2b45d5f5c5c5c5c5c5c5c5c5c5c5c5c5c5c5 # v1

      - name: Start services
        run: |
          docker compose -f compose.yaml -f docker-compose.production.yml up -d --wait

      - name: Run integration tests
        run: |
          sleep 5
          curl -fsS http://localhost:5000/health || exit 1
          pytest tests/ -v -k "integration" --disable-warnings

      - name: Cleanup
        if: always()
        run: |
          docker compose -f compose.yaml -f docker-compose.production.yml down -v