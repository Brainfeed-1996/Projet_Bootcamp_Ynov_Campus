# compose.yaml - Development configuration
# Secrets: use local .env file for development
# In production, use docker-compose.production.yml with Docker secrets

services:
  web:
    build:
      context: .
      target: production
    ports:
      - "5000:5000"
    env_file:
      - .env
    secrets:
      - db_password
      - secret_key
      - postgres_user
      - postgres_password
    environment:
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_USER_FILE=/run/secrets/postgres_user
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=music_hall
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck/web-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ./scripts/healthcheck:/app/scripts/healthcheck:ro

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: music_hall
    secrets:
      - postgres_user
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ./scripts/healthcheck:/scripts/healthcheck:ro
    healthcheck:
      test: ["CMD", "/scripts/healthcheck/db-healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

secrets:
  db_password:
    file: ./secrets/db_password.txt
  secret_key:
    file: ./secrets/secret_key.txt
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  postgres_data:

# ---
# Notes:
# - No default values for secrets (security)
# - Secrets mounted via Docker secrets driver
# - Web service filesystem is read_only
# - User is non-root (see Dockerfile)
# - .env file required for development
# - Healthcheck scripts mounted from host
# ---