# docker-compose.vault.yml - Configuration with Vault integration
# Usage: docker compose -f compose.yaml -f docker-compose.vault.yml up -d
#
# This file extends the configuration to use Vault as the secrets source.
# Requires a Vault instance accessible at http://vault:8200
# or a custom address via VAULT_ADDR.
#
# Prerequisites:
# - Vault must be deployed and accessible
# - Secrets must be initialized in Vault (scripts/vault-init.sh)
# - Vault Agent (vault-agent) is required to retrieve secrets
# - Can be combined with docker-compose.production.yml

services:
  vault:
    image: hashicorp/vault:1.15.0
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
      VAULT_DEV: "1"
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_ROOT_TOKEN:-root}"
    cap_add:
      - IPC_LOCK
    read_only: true
    tmpfs:
      - /tmp
      - /vault/tls
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./config/vault:/vault/config:ro
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 50

  vault-agent:
    image: hashicorp/vault:1.15.0
    container_name: vault-agent
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: "${VAULT_TOKEN:-root}"
    volumes:
      - vault_data:/vault/data
      - vault_secrets:/run/secrets
      - ./config/vault-agent:/etc/vault-agent:ro
    command: |
      sh -c 'echo "$$VAULT_TOKEN" > /tmp/vault-token && exec vault agent -config=/etc/vault-agent/agent.hcl'
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "sh", "-c", "test -f /run/secrets/db_password.txt && test -f /run/secrets/secret_key.txt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 50

  web:
    extends:
      file: compose.yaml
      service: web
    depends_on:
      db:
        condition: service_healthy
      vault-agent:
        condition: service_started
    secrets:
      - db_password
      - secret_key
      - postgres_user
      - postgres_password
      - openai_api_key
    volumes:
      - vault_secrets:/run/secrets
    environment:
      - VAULT_ADDR=http://vault:8200
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /app/.flask
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    extends:
      file: compose.yaml
      service: db
    depends_on:
      vault-agent:
        condition: service_started
    secrets:
      - postgres_user
      - postgres_password
    environment:
      - VAULT_ADDR=http://vault:8200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        max_attempts: 3

secrets:
  db_password:
    file: ./secrets/db_password.txt
  secret_key:
    file: ./secrets/secret_key.txt
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt

volumes:
  postgres_data:
  vault_data:
  vault_logs:
  vault_secrets:

# ---
# Vault integration notes:
# - Vault runs in dev mode (VAULT_DEV=1) for development
# - In production, use VAULT_DEV=0 with proper TLS and storage backend
# - Vault Agent retrieves secrets and writes them to /run/secrets
# - Services read secrets from mounted files (Docker secrets compatible)
# - Can be combined: docker compose -f compose.yaml -f docker-compose.production.yml -f docker-compose.vault.yml up -d
# ---