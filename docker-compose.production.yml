# docker-compose.production.yml - Production configuration with security hardening
# Usage: docker compose -f compose.yaml -f docker-compose.production.yml up -d
#
# Security hardening:
# - No default secret values (fail if undefined)
# - Secrets must be created beforehand with scripts/init-docker-secrets.sh
# - Filesystem mounted read_only
# - Non-root user (UID 1000)
# - Resource limits and reservations
# - Capability dropping (ALL)
# - No new privileges
# - PID limits
# - Structured logging with rotation

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "5000:5000"
    env_file:
      - .env.production
    secrets:
      - db_password
      - secret_key
      - postgres_user
      - postgres_password
      - openai_api_key
    environment:
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_USER_FILE=/run/secrets/postgres_user
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=music_hall
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /app/.flask
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: music_hall
    secrets:
      - postgres_user
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "sh", "-c", "pg_isready -U \"$$(cat /run/secrets/postgres_user)\" -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    read_only: false
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 50
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  db_password:
    file: ./secrets/db_password.txt
  secret_key:
    file: ./secrets/secret_key.txt
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt

volumes:
  postgres_data:

# ---
# Security hardening applied:
# - read_only: true for web service
# - cap_drop: ALL for all services
# - no-new-privileges: true
# - pids_limit to prevent fork bombs
# - Resource limits and reservations
# - Structured logging with rotation (10MB, 3 files)
# - tmpfs for writable directories
# - Secrets mounted via Docker secrets driver
# - Non-root user enforced in Dockerfile
# ---